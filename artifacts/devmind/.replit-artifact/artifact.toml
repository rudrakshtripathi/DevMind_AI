kind = "web"
previewPath = "/"
title = "DevMind AI"
version = "1.0.0"
id = "artifacts/devmind"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23223

[services.development]
run = "pnpm --filter @workspace/devmind run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/devmind", "run", "build" ]
publicDir = "artifacts/devmind/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23223"
BASE_PATH = "/"
